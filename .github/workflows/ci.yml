# Quality gates + smoke probe, per CONTRIBUTING.md.
#
# - `verify` job: the repo gate chain (`pnpm verify`) on windows-latest,
#   the reference platform — Win32-gated security suites must not skip.
# - `smoke` job: boots the built API binary (SQLite, the repo's dev-default
#   database) and probes /health, /ready, and the request pipeline end to end
#   (read-only).
#
# Not wired yet: `pnpm check:i18n` (the web i18n gate) — components still
# carry inline CJK copy pending catalog extraction; wire it into this
# workflow once `pnpm check:i18n` exits 0 locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @grimoire/api db:generate

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Unit tests + coverage gate
        run: pnpm test:coverage

      - name: Boundary scan
        run: pnpm boundaries

      - name: Dependency honesty scan
        run: pnpm check:deps

      - name: Export coverage scan
        run: pnpm check:exports

      - name: Lint
        run: pnpm lint

  smoke:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway values; the smoke probe is read-only.
      # DATABASE_URL follows the repo's dev default (SQLite, see .env.example
      # and docs/operations/postgres.md — PostgreSQL is a deployment-time
      # provider switch). NODE_ENV=production boots the deployed log shape:
      # JSON logs without the dev-only pino-pretty transport, which is not
      # resolvable from @grimoire/foundation under pnpm's strict layout.
      NODE_ENV: production
      JWT_SECRET: ci-smoke-jwt-secret-0123456789abcdef
      DATABASE_URL: "file:./dev.db"
      PORT: 8181
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @grimoire/api db:generate

      - name: Verify database connectivity
        working-directory: services/api
        run: |
          cat > dbcheck.tmp.mjs <<'EOF'
          import { PrismaClient } from '@prisma/client';
          const p = new PrismaClient();
          try {
            await p.$queryRawUnsafe('SELECT 1');
            console.log('DB OK');
          } catch (e) {
            console.error('DB FAIL:', JSON.stringify({
              code: e.code,
              message: e.message,
              meta: e.meta,
              stack: (e.stack || '').split('\n').slice(0, 5),
            }, null, 2));
            process.exit(1);
          } finally {
            await p.$disconnect();
          }
          EOF
          node dbcheck.tmp.mjs
          rm dbcheck.tmp.mjs

      - name: Build API and its workspace dependencies
        run: pnpm --filter @grimoire/api... build

      - name: Start API
        run: |
          node services/api/dist/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8181/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 30s" >&2
          exit 1

      - name: Smoke probe
        run: node scripts/smoke.mjs
