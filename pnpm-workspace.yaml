packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Workspace-local install settings (camelCase keys per pnpm 11 schema)
linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: true
sharedWorkspaceLockfile: true
saveWorkspaceProtocol: true

# Allow native builds for the small set of packages that need them
onlyBuiltDependencies: []
